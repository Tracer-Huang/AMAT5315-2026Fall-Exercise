[package]
name = "ising"
version = "0.1.0"
edition = "2021"
autobins = false
autotests = false

[[bin]]
name = "ising"
path = "src/main.rs"

[[bin]]
name = "descending"
path = "src/bin/descending.rs"

[[test]]
name = "physics"
path = "tests/physics.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "descending"
path = "tests/descending.rs"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
